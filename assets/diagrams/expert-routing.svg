<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img"><title>Map routes and schedule whole experts by occupancy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#34483c" stroke-width="1.4"/></marker></defs><rect width="1000" height="410" fill="#faf9f5"/><text x="30" y="37" font-family="Segoe Print, Comic Sans MS, cursive" font-size="25" fill="#34483c" text-anchor="start"><tspan x="30" dy="0">The token batch is not the expert batch</tspan></text><rect x="30" y="100" width="210" height="80" rx="9" fill="#e7edf4" stroke="#34483c" stroke-width="1.5"/><path d="M34 102 Q135.0 99 236 102" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="135.0" y="133.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#34483c" text-anchor="middle"><tspan x="135.0" dy="0">Global route IDs</tspan><tspan x="135.0" dy="27.3">8 per token</tspan></text><rect x="300" y="100" width="245" height="80" rx="9" fill="#e5eee1" stroke="#34483c" stroke-width="1.5"/><path d="M304 102 Q422.5 99 541 102" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="422.5" y="133.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#34483c" text-anchor="middle"><tspan x="422.5" dy="0">Map + histogram</tspan><tspan x="422.5" dy="27.3">local expert loads</tspan></text><polyline points="242,140 296,140" fill="none" stroke="#34483c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="640" y="65" width="325" height="80" rx="9" fill="#e5eee1" stroke="#34483c" stroke-width="1.5"/><path d="M644 67 Q802.5 64 961 67" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="802.5" y="98.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#34483c" text-anchor="middle"><tspan x="802.5" dy="0">≤ 16 routes / expert</tspan><tspan x="802.5" dy="27.3">32-row Marlin tile</tspan></text><rect x="640" y="185" width="325" height="80" rx="9" fill="#f4e5d6" stroke="#34483c" stroke-width="1.5"/><path d="M644 187 Q802.5 184 961 187" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="802.5" y="218.7" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#34483c" text-anchor="middle"><tspan x="802.5" dy="0">&gt; 16 routes / expert</tspan><tspan x="802.5" dy="27.3">keep stock tile</tspan></text><polyline points="547,140 590,140 590,105 635,105" fill="none" stroke="#34483c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="590,140 590,225 635,225" fill="none" stroke="#34483c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="307" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#34483c" text-anchor="start"><tspan x="307" dy="0">Non-local routes → −1</tspan><tspan x="307" dy="23.400000000000002">Remain inactive in both classes</tspan></text><text x="40" y="348" font-family="Segoe Print, Comic Sans MS, cursive" font-size="23" fill="#34483c" text-anchor="start"><tspan x="40" dy="0">Every live route once. Same weights. Same finalization.</tspan></text></svg>