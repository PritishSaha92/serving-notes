<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"><title>Different row counts can change the reduction layout</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#34483c" stroke-width="1.4"/></marker></defs><rect width="1000" height="400" fill="#faf9f5"/><text x="35" y="34" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#34483c" text-anchor="start"><tspan x="35" dy="0">Same 56 tokens. Different launch configuration.</tspan></text><rect x="35" y="80" width="420" height="100" rx="9" fill="#e7edf4" stroke="#34483c" stroke-width="1.5"/><path d="M39 82 Q245.0 79 451 82" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="245.0" y="123.1" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#34483c" text-anchor="middle"><tspan x="245.0" dy="0">Stock: 18 × 56 = 1,008 rows</tspan><tspan x="245.0" dy="29.900000000000002">BLOCK_M = 4</tspan></text><rect x="540" y="80" width="425" height="100" rx="9" fill="#f4e5d6" stroke="#34483c" stroke-width="1.5"/><path d="M544 82 Q752.5 79 961 82" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="752.5" y="123.4" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#34483c" text-anchor="middle"><tspan x="752.5" dy="0">Original fusion: 20 × 56 = 1,120</tspan><tspan x="752.5" dy="28.6">BLOCK_M = 8</tspan></text><polyline points="245,183 245,237" fill="none" stroke="#34483c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="750,183 750,237" fill="none" stroke="#34483c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="35" y="242" width="420" height="65" rx="9" fill="#eeeee7" stroke="#34483c" stroke-width="1.5"/><path d="M39 244 Q245.0 241 451 244" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="245.0" y="281.15" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#34483c" text-anchor="middle"><tspan x="245.0" dy="0">Different FP32 reduction grouping</tspan></text><rect x="540" y="242" width="425" height="65" rx="9" fill="#f4e5d6" stroke="#34483c" stroke-width="1.5"/><path d="M544 244 Q752.5 241 961 244" fill="none" stroke="#34483c" stroke-width=".7" opacity=".32"/><text x="752.5" y="280.8" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#34483c" text-anchor="middle"><tspan x="752.5" dy="0">A value crosses a rounding midpoint</tspan></text><polyline points="458,275 535,275" fill="none" stroke="#34483c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="361" font-family="Segoe Print, Comic Sans MS, cursive" font-size="22" fill="#34483c" text-anchor="start"><tspan x="40" dy="0">One changed query byte is enough to fail an exact comparison.</tspan></text></svg>